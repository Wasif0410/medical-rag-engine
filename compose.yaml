services:
  api:
    build: .
    image: medical-rag-engine:local
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MEDICAL_RAG_API_KEY: ${MEDICAL_RAG_API_KEY:?Set MEDICAL_RAG_API_KEY in .env}
    volumes:
      - corpus:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped

volumes:
  corpus:
